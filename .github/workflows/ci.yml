name: Standalone validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  readme:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:readme
      - if: runner.os == 'macOS'
        run: npm test -- --run
